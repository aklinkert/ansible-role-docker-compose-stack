name: test
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  pull-notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install ansible-core into a venv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install 'ansible-core==2.18.18'
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Parse the whole role (tasks, imports, handlers)
        working-directory: tests
        run: |
          ansible-playbook --syntax-check role.yml
          ansible-playbook --list-tasks role.yml
      - run: tests/run.sh
